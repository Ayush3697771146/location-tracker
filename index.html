<script>
    function getLocation() {
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(sendLocation, showError);
        } else {
            alert("Geolocation is not supported by this browser.");
        }
    }

    function sendLocation(position) {
        let latitude = position.coords.latitude;
        let longitude = position.coords.longitude;
        let accuracy = position.coords.accuracy;

        // Google Form URL (replace with your own form URL)
        let formURL = "https://docs.google.com/forms/d/e/1FAIpQLSfc3LJEhqh3dbSqUKw-2aE138piFREpAHoM7MWMX_3OGa3wyQ/formResponse";

        // Sending data to Google Forms
        fetch(formURL, {
            method: "POST",
            mode: "no-cors",
            body: new URLSearchParams({
                "entry.LAT_ENTRY_ID": latitude,   // Replace with Latitude entry ID
                "entry.LON_ENTRY_ID": longitude,  // Replace with Longitude entry ID
                "entry.ACC_ENTRY_ID": accuracy    // Replace with Accuracy entry ID
            })
        });

        alert("Location Sent Successfully!");
    }

    function showError(error) {
        alert("Error getting location: " + error.message);
    }
</script>
